title: wickworks
tagline: OHLC bars in, indicators and SMC objects out
description: A stateless HTTP and MCP service that takes OHLCV bars and returns the technical indicators and Smart Money Concepts objects you ask for, and nothing else.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-wickworks
repository: psyb0t/docker-wickworks
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-wickworks
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-wickworks/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-wickworks
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
